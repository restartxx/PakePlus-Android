name: Android Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - 'main'

env:
  NAME: SillyTavern
  VERSION: 0.0.6
  PUBBODY: Package for personal use only, please do not use for commercial purposes（打包仅限个人使用，请勿传播或商业用途）

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Init Project Config
        run: |
          pnpm install
          pnpm pp:worker

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --debug

      - name: Debug - List generated APK files
        run: |
          ls -la app/build/outputs/apk/release/ || echo "Directory not found - build may have failed"

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/release/
          if [ -f "app-release.apk" ]; then
            mv app-release.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk
          elif [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk
          else
            echo "No APK file found to rename"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/${{ env.NAME }}-v${{ env.VERSION }}.apk
          tag_name: '${{ env.NAME }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
